services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: phin
      POSTGRES_DB: phin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.cjs first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phin -d phin"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
